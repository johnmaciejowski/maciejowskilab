<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Copies — Maciejowski Lab</title>
<style>
  /* ---- Design tokens (a later visual pass can override these) ---- */
  :root{
    --bg:#ffffff; --fg:#191919; --muted:#5f5f5f;
    --card:#f5f5f4; --border:#e2e2df;
    --accent:#3b6ea5; --accent-ink:#ffffff;
    --good:#2e7d5b; --bad:#a5453b;
    --radius:14px; --gap:1rem; --maxw:640px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
       line-height:1.5;padding:1.25rem}
  .wrap{max-width:var(--maxw);margin:0 auto}
  a{color:var(--accent)}
  .back{display:inline-block;font-size:.9rem;margin-bottom:1rem}
  h1{font-size:1.6rem;margin:.2rem 0}
  .lede{color:var(--muted);margin:.25rem 0 1.25rem}
  .card{background:var(--card);border:1px solid var(--border);
        border-radius:var(--radius);padding:1.1rem}
  .counter{color:var(--muted);font-size:.9rem}
  .tally{font-size:1.05rem;margin:.4rem 0 1rem}
  .tally b{font-size:1.3rem}
  .beat{min-height:2.8em;margin:0 0 1rem}
  .daughters{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
  .daughter{background:var(--bg);border:2px solid var(--border);
            border-radius:var(--radius);padding:1rem .75rem;cursor:pointer;
            font:inherit;color:inherit;text-align:center;transition:border-color .15s,transform .15s}
  .daughter:hover,.daughter:focus-visible{border-color:var(--accent);outline:none}
  .daughter:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
  .daughter .num{font-size:1.8rem;font-weight:700;display:block}
  .daughter .lab{font-size:.8rem;color:var(--muted)}
  .dots{min-height:1.4em;margin-top:.4rem;font-size:1rem;line-height:1.2;word-break:break-word}
  .dot{display:inline-block}
  button.primary{font:inherit;background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:999px;padding:.7rem 1.3rem;cursor:pointer}
  button.primary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
  .result .cat{font-size:1.7rem;font-weight:700;margin:.2rem 0}
  .result .score{color:var(--muted);margin:.1rem 0 .8rem}
  .share{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
  .share input{flex:1 1 12rem;font:inherit;padding:.55rem .6rem;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
  .nudge{font-size:.9rem;color:var(--muted);margin-top:.8rem}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Lab games</a>

  <!-- ===================================================================
       EDIT ME. Everything a non-coder needs is in this one object.
       - oncogene:   name of the gene riding on the ecDNA circles
       - startCopies / divisions: length + starting point of a run
       - beats:      little captions shown as you play (cycled)
       - results:    categories, checked top-down; first match whose
                     `min` <= final copy count wins
       =================================================================== -->
  <script>
  const GAME = {
    oncogene: "MYC",
    startCopies: 2,
    divisions: 6,
    beats: [
      "These circles have no centromere — no handle for the cell to grab. Nobody's steering.",
      "Each round the cell copies its circles, then splits. Where they land is pure luck.",
      "Tumors keep the daughters carrying more copies. So do you: follow the bigger pile.",
      "Even splitting would give each daughter half. But there's no machinery making it even.",
      "Watch the count wobble — that lopsidedness is the whole point.",
      "One lucky lineage can pull far ahead of its siblings."
    ],
    results: [
      { min: 40, name: "Runaway amplifier",
        blurb: "Dozens of copies of a growth gene, all from luck plus a little selection. That's how ecDNA cranks an oncogene up to a roar." },
      { min: 16, name: "High-copy hustler",
        blurb: "You rode the random splits upward. In a real tumor, cells like this out-grow their neighbors and take over." },
      { min: 6, name: "Slow climber",
        blurb: "A modest haul — but notice you never actually steered. Every gain was the coin landing your way." },
      { min: 1, name: "Barely hanging on",
        blurb: "The circles kept drifting to the other daughter. Without a centromere, that's always a risk." },
      { min: 0, name: "Cleared out",
        blurb: "Every last circle wandered off to a sibling cell. Random inheritance giveth, and taketh away." }
    ]
  };
  </script>

  <h1>Lucky Copies</h1>
  <p class="lede">A one-minute game about how <b>ecDNA</b> — little rings of DNA
  carrying extra copies of a cancer gene — gets passed on when a cell divides.</p>

  <div id="stage" class="card" aria-live="polite"></div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const R = () => Math.random();
  let copies, round, ended;

  function dots(n){
    const cap = 24;
    if(n === 0) return '<span class="lab">(none)</span>';
    const shown = Math.min(n, cap);
    let s = '';
    for(let i=0;i<shown;i++) s += '<span class="dot">◍</span>';
    if(n > cap) s += ' <span class="lab">+'+(n-cap)+'</span>';
    return s;
  }

  function splitPool(pool){
    let left = 0;
    for(let i=0;i<pool;i++) if(R() < 0.5) left++;
    return [left, pool - left];
  }

  function start(){
    copies = GAME.startCopies; round = 0; ended = false;
    renderChoice();
  }

  function renderChoice(){
    const pool = copies * 2;               // ecDNA replicates once per cycle
    const [l, r] = splitPool(pool);
    const beat = GAME.beats[round % GAME.beats.length];
    const last = (round === GAME.divisions - 1);
    stage.innerHTML = `
      <p class="counter">Division ${round+1} of ${GAME.divisions}</p>
      <p class="tally">Carrying <b>${copies}</b> ${copies===1?'copy':'copies'} of
        <b>${GAME.oncogene}</b> → replicated to <b>${pool}</b>, now splitting…</p>
      <p class="beat">${beat}</p>
      <div class="daughters" role="group" aria-label="Choose which daughter cell to follow">
        <button class="daughter" data-n="${l}">
          <span class="lab">Left daughter</span>
          <span class="num">${l}</span>
          <span class="dots" aria-hidden="true">${dots(l)}</span>
        </button>
        <button class="daughter" data-n="${r}">
          <span class="lab">Right daughter</span>
          <span class="num">${r}</span>
          <span class="dots" aria-hidden="true">${dots(r)}</span>
        </button>
      </div>
      <p class="nudge">${last ? 'Last division — pick a daughter to finish.' : 'Follow whichever daughter you like. (← / → keys work too.)'}</p>
    `;
    const btns = [...stage.querySelectorAll('.daughter')];
    btns.forEach(b => b.addEventListener('click', () => choose(+b.dataset.n)));
    btns[0].focus();
    stage._keys = (e)=>{
      if(e.key === 'ArrowLeft'){ btns[0].focus(); }
      else if(e.key === 'ArrowRight'){ btns[1].focus(); }
    };
    document.addEventListener('keydown', stage._keys);
  }

  function choose(n){
    document.removeEventListener('keydown', stage._keys);
    copies = n; round++;
    if(round >= GAME.divisions) renderResult();
    else renderChoice();
  }

  function categoryFor(n){
    return GAME.results.find(r => n >= r.min) || GAME.results[GAME.results.length-1];
  }

  function renderResult(){
    ended = true;
    const cat = categoryFor(copies);
    const line = `Lucky Copies — ${cat.name} · ${copies} ${copies===1?'copy':'copies'} of ${GAME.oncogene} after ${GAME.divisions} divisions`;
    stage.innerHTML = `
      <div class="result">
        <p class="counter">You followed one lineage to the end.</p>
        <p class="cat">${cat.name}</p>
        <p class="score">Final tally: <b>${copies}</b> ${copies===1?'copy':'copies'} of ${GAME.oncogene}</p>
        <p>${cat.blurb}</p>
        <div class="share">
          <label class="visually-hidden" for="res">Your result</label>
          <input id="res" readonly value="${line.replace(/"/g,'&quot;')}">
          <button class="primary" id="copy" type="button">Copy result</button>
        </div>
        <p class="nudge">Send us your category — it's a fun thing to mention if you're
          thinking about rotating, postdoc-ing, or joining the lab.</p>
        <p style="margin-top:1rem"><button class="primary" id="again" type="button">Play again</button></p>
      </div>`;
    const input = document.getElementById('res');
    document.getElementById('copy').addEventListener('click', ()=>copy(input));
    const again = document.getElementById('again');
    again.addEventListener('click', start);
    document.getElementById('copy').focus();
  }

  function copy(input){
    input.select(); input.setSelectionRange(0, 999);
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(input.value).catch(()=>{}); ok = true; }
    const btn = document.getElementById('copy');
    if(btn){ const t = btn.textContent; btn.textContent = ok ? 'Copied ✓' : 'Select & copy';
             setTimeout(()=>{ btn.textContent = t; }, 1400); }
  }

  start();
})();
</script>
</body>
</html>
