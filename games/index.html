<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games — Maciejowski Lab</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Minimal placeholder layout — the site-wide visual pass can replace this. */
    :root{ --border:#e2e2df; --muted:#5f5f5f; --accent:#3b6ea5; --radius:14px; }
    .games{list-style:none;padding:0;margin:1.25rem 0;display:grid;gap:1rem;
           grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
    .games a{display:block;height:100%;padding:1.1rem;border:1px solid var(--border);
             border-radius:var(--radius);text-decoration:none;color:inherit}
    .games a:hover,.games a:focus-visible{border-color:var(--accent);outline:none}
    .games h2{margin:.1rem 0 .3rem;font-size:1.15rem}
    .games p{margin:0;color:var(--muted);font-size:.95rem}
    .tag{display:inline-block;font-size:.75rem;color:var(--muted);
         border:1px solid var(--border);border-radius:999px;padding:.05rem .5rem;margin-top:.5rem}
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SVKRLTYJR9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SVKRLTYJR9');
  </script>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../people.html">People</a></li>
        <li><a href="../research/index.html">Research</a></li>
        <li><a href="../publications.html">Publications</a></li>
        <li><a href="../join.html">Join</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Games</h1>
    <p>Little playable things about what we study. Each one gives you a result —
    tell us what you got.</p>

    <!-- EDIT ME: add or reorder games here. "href" is the game's file (or a full
         URL for something hosted elsewhere). Set "external:true" for an off-site
         link so it opens in a new tab. -->
    <ul class="games" id="games"></ul>
  </main>

  <script>
    const GAMES = [
      { href: "lucky-copies.html",
        title: "Lucky Copies",
        blurb: "Follow one lineage as ecDNA rings are handed to the daughter nuclei — faithfully, but never evenly.",
        tag: "≈1 min" },
      { href: "molecular-bee.html",
        title: "Molecular Spelling Bee",
        blurb: "Spell words from seven letters. Ordinary words count; the biology words teach you something.",
        tag: "≈2 min" },
      { href: "bio-wordle.html",
        title: "Bio Wordle",
        blurb: "Guess the five-letter biology word in six tries. The answer's meaning is revealed at the end.",
        tag: "≈2 min" },
      { href: "https://sophie006liu.github.io/vegetal/",
        title: "Which vegetable are you?",
        blurb: "The lab's original personality quiz. Pick your spirit vegetable.",
        tag: "the classic", external: true }
    ];
    const ul = document.getElementById('games');
    GAMES.forEach(g => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = g.href;
      if(g.external){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
      a.innerHTML = '<h2>'+g.title+(g.external?' ↗':'')+'</h2><p>'+g.blurb+'</p>'+
        (g.tag ? '<span class="tag">'+g.tag+'</span>' : '');
      li.appendChild(a);
      ul.appendChild(li);
    });
  </script>
</body>
</html>
