<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Crossword — Maciejowski Lab</title>
<style>
  :root{
    --bg:#ffffff; --fg:#191919; --muted:#5f5f5f; --card:#f5f5f4; --border:#c9c9c6;
    --accent:#3b6ea5; --accent-soft:#dbe6f3; --hl:#f3e7a6; --hl-word:#fbf3cf;
    --good:#2e7d5b; --bad:#a5453b; --black:#191919;
    --radius:12px; --maxw:560px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;padding:1.25rem}
  .wrap{max-width:var(--maxw);margin:0 auto}
  a{color:var(--accent)} .back{display:inline-block;font-size:.9rem;margin-bottom:1rem}
  h1{font-size:1.6rem;margin:.2rem 0}
  .lede{color:var(--muted);margin:.25rem 0 1rem}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
  .controls{display:flex;gap:.5rem;flex-wrap:wrap}
  button.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--border);
    border-radius:999px;padding:.45rem 1rem;cursor:pointer}
  button.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--black);
        border:2px solid var(--black);width:100%;max-width:360px;margin:.25rem auto .75rem;aspect-ratio:1/1}
  .cell{position:relative;background:var(--bg);display:flex;align-items:center;justify-content:center;
        font-size:clamp(1.2rem,7vw,1.7rem);font-weight:600;text-transform:uppercase;cursor:pointer;user-select:none}
  .cell.black{background:var(--black);cursor:default}
  .cell.hl-word{background:var(--hl-word)}
  .cell.hl{background:var(--hl)}
  .cell .num{position:absolute;top:1px;left:2px;font-size:.55rem;font-weight:600;color:var(--muted)}
  .cell.bad{color:var(--bad)}
  .cluebar{background:var(--accent-soft);border-radius:10px;padding:.6rem .8rem;margin:.25rem 0 .75rem;
    display:flex;align-items:center;gap:.6rem;min-height:2.6em}
  .cluebar .tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;flex:none}
  .cluebar .txt{font-size:1rem}
  .kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:.5rem}
  .kbrow{display:flex;gap:5px;justify-content:center}
  .key{font:inherit;font-weight:600;border:none;border-radius:6px;background:var(--card);color:var(--fg);
    padding:.7rem .5rem;min-width:1.9rem;cursor:pointer;text-transform:uppercase}
  .key.wide{min-width:3.2rem;font-size:.8rem}
  .key:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
  .clues{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
  .clues h2{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .3rem}
  .clues ol{list-style:none;margin:0;padding:0;font-size:.9rem}
  .clues li{padding:.2rem .3rem;border-radius:6px;cursor:pointer;display:flex;gap:.4rem}
  .clues li.active{background:var(--hl-word)}
  .clues li b{color:var(--muted);min-width:1.2em}
  .end{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-top:1rem}
  .end .cat{font-size:1.3rem;font-weight:700;margin:.1rem 0}
  .share{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
  .share input{flex:1 1 12rem;font:inherit;padding:.55rem .6rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
  button.primary{font:inherit;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:.55rem 1.2rem;cursor:pointer}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SVKRLTYJR9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-SVKRLTYJR9');
</script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Lab games</a>
  <h1>Mini Crossword</h1>
  <p class="lede">A little 5×5. Fill every square. Tap a square (or a clue) to start,
  then type. Tap a square twice to switch across / down.</p>

  <!-- ===================================================================
       EDIT ME to set a new puzzle.
       - grid:   five 5-character rows of the SOLUTION (use "#" for a black
                 square). Every across and down run must be a real word.
       - clues:  keyed by the square's number (computed automatically) and
                 direction. Numbering is standard crossword order.
       Tip: build the grid first, read the numbers off the rendered board,
       then write the clues. Keep clues gentle — the crossings do the teaching.
       =================================================================== -->
  <script>
  const PUZZLE = {
    grid: ["HEART","EMBER","ABUSE","RESIN","TREND"],
    clues: {
      across: {
        1: "Blood-pumping organ — or the crux of a matter",
        6: "Smoldering leftover of a fire",
        7: "Put to wrong use",
        8: "Sticky tree secretion; also the medium samples are embedded in for electron microscopy",
        9: "Upward or downward pattern in a dataset"
      },
      down: {
        1: "Where affection supposedly lives",
        2: "A fire's dying glow",
        3: "Mistreat",
        4: "Pine goo — and what a specimen is set in before thin-sectioning",
        5: "What's currently in fashion"
      }
    }
  };
  </script>

  <div class="bar">
    <span class="timer" id="timer" aria-live="off">0:00</span>
    <span class="controls">
      <button class="btn" id="check" type="button">Check</button>
      <button class="btn" id="reveal" type="button">Reveal</button>
    </span>
  </div>

  <div class="grid" id="grid" role="group" aria-label="Crossword grid"></div>

  <div class="cluebar">
    <span class="tag" id="cluetag">1A</span>
    <span class="txt" id="cluetext"></span>
  </div>

  <div class="kb" id="kb"></div>

  <div class="clues">
    <div><h2>Across</h2><ol id="across"></ol></div>
    <div><h2>Down</h2><ol id="down"></ol></div>
  </div>

  <div id="end"></div>
</div>

<script>
(function(){
  const N = 5;
  const $ = id => document.getElementById(id);
  const rows = PUZZLE.grid.map(r => r.toUpperCase().split(''));
  const black = (r,c) => rows[r][c] === '#';

  // ---- numbering + slots ----
  const num = Array.from({length:N},()=>Array(N).fill(0));
  let n = 0;
  const acrossSlots = {}, downSlots = {};      // by number -> [{r,c}]
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    if(black(r,c)) continue;
    const startA = (c===0 || black(r,c-1)) && (c+1<N && !black(r,c+1));
    const startD = (r===0 || black(r-1,c)) && (r+1<N && !black(r+1,c));
    if(startA || startD){ n++; num[r][c]=n;
      if(startA){ const s=[]; let cc=c; while(cc<N && !black(r,cc)){ s.push({r,c:cc}); cc++; } acrossSlots[n]=s; }
      if(startD){ const s=[]; let rr=r; while(rr<N && !black(rr,c)){ s.push({r:rr,c}); rr++; } downSlots[n]=s; }
    }
  }
  // cell -> slot lookups
  function slotAt(r,c,dir){
    const map = dir==='across'?acrossSlots:downSlots;
    for(const k in map){ if(map[k].some(p=>p.r===r&&p.c===c)) return {num:+k, cells:map[k]}; }
    return null;
  }

  // ---- state ----
  const user = Array.from({length:N},()=>Array(N).fill(''));
  let cur = firstOpen();
  let dir = slotAt(cur.r,cur.c,'across') ? 'across' : 'down';
  let started = false, solved = false, t0 = 0, tick = null;

  function firstOpen(){ for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(!black(r,c)) return {r,c}; }

  // ---- build grid DOM ----
  const gridEl = $('grid'); const cellEls = {};
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const d = document.createElement('div');
    d.className = 'cell' + (black(r,c)?' black':'');
    if(!black(r,c)){
      d.tabIndex = 0;
      if(num[r][c]){ const s=document.createElement('span'); s.className='num'; s.textContent=num[r][c]; d.appendChild(s); }
      const L=document.createElement('span'); L.className='let'; d.appendChild(L);
      d.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1));
      d.addEventListener('click',()=>{ if(cur.r===r&&cur.c===c) toggleDir(); else { cur={r,c}; } paint(); });
    }
    gridEl.appendChild(d); cellEls[r+'-'+c]=d;
  }

  // ---- clue lists ----
  function buildClueList(dir){
    const ol=$(dir), map=dir==='across'?acrossSlots:downSlots;
    Object.keys(map).map(Number).sort((a,b)=>a-b).forEach(k=>{
      const li=document.createElement('li'); li.dataset.num=k; li.dataset.dir=dir;
      li.innerHTML='<b>'+k+'</b><span>'+(PUZZLE.clues[dir][k]||'')+'</span>';
      li.addEventListener('click',()=>{ dirSet(dir); cur={...map[k][0]}; paint(); });
      ol.appendChild(li);
    });
  }
  function dirSet(d){ dir=d; }
  buildClueList('across'); buildClueList('down');

  // ---- keyboard ----
  const LAYOUT=["QWERTYUIOP","ASDFGHJKL","↵ZXCVBNM⌫"];
  const kb=$('kb');
  LAYOUT.forEach(line=>{ const row=document.createElement('div'); row.className='kbrow';
    for(const ch of line){ const b=document.createElement('button'); b.type='button'; b.className='key';
      if(ch==='↵'){ b.classList.add('wide'); b.textContent='Dir'; b.dataset.k='DIR'; b.setAttribute('aria-label','Switch direction'); }
      else if(ch==='⌫'){ b.classList.add('wide'); b.textContent='Del'; b.dataset.k='DEL'; b.setAttribute('aria-label','Delete'); }
      else { b.textContent=ch; b.dataset.k=ch; }
      b.addEventListener('click',()=>handle(b.dataset.k));
      row.appendChild(b);
    } kb.appendChild(row);
  });

  // ---- rendering ----
  function paint(){
    const slot = slotAt(cur.r,cur.c,dir) || slotAt(cur.r,cur.c,dir==='across'?'down':'across');
    if(!slotAt(cur.r,cur.c,dir)) dir = dir==='across'?'down':'across';
    const active = slotAt(cur.r,cur.c,dir);
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(black(r,c)) continue;
      const d=cellEls[r+'-'+c]; d.classList.remove('hl','hl-word','bad');
      d.querySelector('.let').textContent = user[r][c];
      if(active && active.cells.some(p=>p.r===r&&p.c===c)) d.classList.add('hl-word');
    }
    cellEls[cur.r+'-'+cur.c].classList.add('hl');
    cellEls[cur.r+'-'+cur.c].focus({preventScroll:true});
    // clue bar
    $('cluetag').textContent = active.num + (dir==='across'?'A':'D');
    $('cluetext').textContent = PUZZLE.clues[dir][active.num] || '';
    // clue list active
    document.querySelectorAll('.clues li').forEach(li=>li.classList.toggle('active',
      +li.dataset.num===active.num && li.dataset.dir===dir));
  }
  function toggleDir(){ const other=dir==='across'?'down':'across'; if(slotAt(cur.r,cur.c,other)) dir=other; }

  // ---- input ----
  function startTimer(){ if(started) return; started=true; t0=Date.now();
    tick=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); $('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },500);
  }
  function advance(){ const s=slotAt(cur.r,cur.c,dir); if(!s) return;
    const i=s.cells.findIndex(p=>p.r===cur.r&&p.c===cur.c);
    for(let j=i+1;j<s.cells.length;j++){ cur={...s.cells[j]}; return; } // stop at word end
  }
  function retreat(){ const s=slotAt(cur.r,cur.c,dir); if(!s) return;
    const i=s.cells.findIndex(p=>p.r===cur.r&&p.c===cur.c);
    if(i>0) cur={...s.cells[i-1]};
  }
  function handle(k){
    if(solved) return;
    if(k==='DIR'){ toggleDir(); paint(); return; }
    if(k==='DEL'){ if(user[cur.r][cur.c]){ user[cur.r][cur.c]=''; } else { retreat(); user[cur.r][cur.c]=''; } paint(); return; }
    if(/^[A-Z]$/.test(k)){ startTimer(); user[cur.r][cur.c]=k; advance(); paint(); checkWin(); }
  }
  function move(dr,dc){
    let r=cur.r, c=cur.c;
    do{ r+=dr; c+=dc; }while(r>=0&&r<N&&c>=0&&c<N&&black(r,c));
    if(r>=0&&r<N&&c>=0&&c<N){ cur={r,c}; const want=(dr!==0)?'down':'across'; if(slotAt(r,c,want)) dir=want; paint(); }
  }
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const k=e.key.toUpperCase();
    if(/^[A-Z]$/.test(k)&&e.key.length===1){ handle(k); e.preventDefault(); }
    else if(e.key==='Backspace'){ handle('DEL'); e.preventDefault(); }
    else if(e.key===' '){ toggleDir(); paint(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ move(-1,0); e.preventDefault(); }
    else if(e.key==='ArrowDown'){ move(1,0); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ move(0,-1); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ move(0,1); e.preventDefault(); }
    else if(e.key==='Enter'){ toggleDir(); paint(); e.preventDefault(); }
  });

  // ---- check / reveal / win ----
  $('check').addEventListener('click',()=>{
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(black(r,c))continue;
      const d=cellEls[r+'-'+c]; if(user[r][c] && user[r][c]!==rows[r][c]) d.classList.add('bad'); }
    setTimeout(()=>document.querySelectorAll('.cell.bad').forEach(d=>d.classList.remove('bad')),1500);
  });
  $('reveal').addEventListener('click',()=>{
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(!black(r,c)) user[r][c]=rows[r][c]; }
    paint(); checkWin(true);
  });
  function checkWin(revealed){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(black(r,c))continue; if(user[r][c]!==rows[r][c]) return; }
    solved=true; if(tick) clearInterval(tick);
    const secs = started ? Math.floor((Date.now()-t0)/1000) : 0;
    const time = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
    const line = 'Mini Crossword — ' + (revealed?'revealed':'solved'+(started?(' in '+time):'')) ;
    $('end').innerHTML =
      '<div class="end"><p class="cat">'+(revealed?'Revealed':'Solved! 🎉')+'</p>'+
      (revealed?'':'<p class="lede" style="margin:.1rem 0">Time: '+time+'</p>')+
      '<div class="share"><label class="visually-hidden" for="res">Your result</label>'+
      '<input id="res" readonly value="'+line.replace(/"/g,'&quot;')+'">'+
      '<button class="primary" id="copy" type="button">Copy result</button></div>'+
      '<p class="lede" style="margin-top:.8rem">Tell us your time if you\'re thinking about joining the lab.</p></div>';
    const input=$('res');
    $('copy').addEventListener('click',()=>{ input.select(); input.setSelectionRange(0,999);
      let ok=false; try{ok=document.execCommand('copy');}catch(e){}
      if(navigator.clipboard){navigator.clipboard.writeText(input.value).catch(()=>{});ok=true;}
      const b=$('copy'); const t=b.textContent; b.textContent=ok?'Copied ✓':'Select & copy'; setTimeout(()=>b.textContent=t,1400); });
  }

  paint();
})();
</script>
</body>
</html>
