<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strands — Maciejowski Lab</title>
<style>
  :root{
    --bg:#ffffff; --fg:#191919; --muted:#5f5f5f; --card:#f5f5f4; --border:#c9c9c6;
    --accent:#3b6ea5; --path:#cfe0f2; --found:#bfe3cf; --span:#f0d98a;
    --radius:12px; --maxw:560px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;padding:1.25rem}
  .wrap{max-width:var(--maxw);margin:0 auto}
  a{color:var(--accent)} .back{display:inline-block;font-size:.9rem;margin-bottom:1rem}
  h1{font-size:1.6rem;margin:.2rem 0}
  .lede{color:var(--muted);margin:.25rem 0 .75rem}
  .theme{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.6rem .9rem;margin:.25rem 0 .8rem}
  .theme .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .theme .v{font-size:1.05rem;font-weight:600}
  .status{min-height:1.5em;text-align:center;font-weight:600;color:var(--muted);margin:.2rem 0}
  .board{display:grid;gap:6px;justify-content:center;margin:.4rem auto;touch-action:none;user-select:none;width:max-content;max-width:100%}
  .row{display:flex;gap:6px}
  .cell{width:clamp(2.5rem,13vw,3.1rem);height:clamp(2.5rem,13vw,3.1rem);border-radius:50%;
        border:1px solid var(--border);background:var(--bg);font:inherit;font-size:1.25rem;font-weight:600;
        text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--fg)}
  .cell.path{background:var(--path);border-color:var(--accent)}
  .cell.found{background:var(--found);border-color:var(--found)}
  .cell.span{background:var(--span);border-color:var(--span)}
  .cell:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
  .controls{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.7rem}
  button.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:.5rem 1.1rem;cursor:pointer}
  button.primary{font:inherit;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:.5rem 1.2rem;cursor:pointer}
  button.btn:focus-visible,button.primary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
  .progress{text-align:center;color:var(--muted);font-size:.9rem;margin-top:.6rem}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-top:.5rem}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:.2rem .7rem;font-size:.85rem}
  .chip.span{background:var(--span);border-color:var(--span)}
  .end{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-top:1rem}
  .end .cat{font-size:1.3rem;font-weight:700;margin:.1rem 0}
  .share{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
  .share input{flex:1 1 12rem;font:inherit;padding:.55rem .6rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SVKRLTYJR9"></script>

</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Lab games</a>
  <h1>Strands</h1>
  <p class="lede">Find every word hidden in the grid. Drag across neighbouring
  letters (or tap them one by one). One answer is the <b>spangram</b> — it stretches
  across the grid and names the theme. Every letter is used exactly once.</p>

  <!-- ===================================================================
       EDIT ME to set a new board. The words must PERFECTLY TILE the grid:
       every cell used exactly once, each word a path of adjacent cells
       (including diagonals), and the spangram must touch two opposite edges.
       - grid:     rows of letters
       - theme/spangram: the theme label and its answer
       - words:    each { word, path:[[r,c],...], spangram? }
       Build the solution first, then read the letters off the paths.
       (There is a checker in the repo history if you need to validate a new one.)
       =================================================================== -->
  <script>
  const PUZZLE = {
    theme: "Reading the genome",
    spangram: "GENOME",
    grid: ["LOOPGE","ESABEN","GENOME","RNODOC","INGRNA"],
    words: [
      { word:"LOOP",   path:[[0,0],[0,1],[0,2],[0,3]] },
      { word:"GENE",   path:[[0,4],[0,5],[1,5],[1,4]] },
      { word:"BASE",   path:[[1,3],[1,2],[1,1],[1,0]] },
      { word:"GENOME", path:[[2,0],[2,1],[2,2],[2,3],[2,4],[2,5]], spangram:true },
      { word:"CODON",  path:[[3,5],[3,4],[3,3],[3,2],[3,1]] },
      { word:"RING",   path:[[3,0],[4,0],[4,1],[4,2]] },
      { word:"RNA",    path:[[4,3],[4,4],[4,5]] }
    ]
  };
  </script>

  <div class="theme"><div class="k">Today's theme</div><div class="v" id="theme"></div></div>
  <div class="status" id="status">Drag or tap letters to trace a word.</div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button class="btn" id="clear" type="button">Clear</button>
    <button class="primary" id="submit" type="button">Submit word</button>
  </div>
  <div class="progress" id="progress"></div>
  <div class="chips" id="chips"></div>
  <div id="end"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const rows = PUZZLE.grid.map(r => r.toUpperCase().split(''));
  const R = rows.length, C = rows[0].length;
  $('theme').textContent = PUZZLE.theme;

  const key = (r,c) => r+'-'+c;
  const found = {};                 // word -> true
  const cellState = {};             // key -> 'found' | 'span'
  let path = [];                    // current [{r,c}]
  let dragging = false;

  // canonical path signatures (forward + reverse) -> {word, spangram}
  const sig = {};
  PUZZLE.words.forEach(w=>{
    const f = w.path.map(p=>p.join(',')).join(' ');
    const rv = w.path.slice().reverse().map(p=>p.join(',')).join(' ');
    sig[f] = w; sig[rv] = w;
  });

  // ---- board ----
  const board = $('board'); const cellEls = {};
  for(let r=0;r<R;r++){
    const row=document.createElement('div'); row.className='row';
    for(let c=0;c<C;c++){
      const b=document.createElement('button'); b.type='button'; b.className='cell';
      b.textContent=rows[r][c]; b.dataset.r=r; b.dataset.c=c;
      b.setAttribute('aria-label','Letter '+rows[r][c]+' at row '+(r+1)+' column '+(c+1));
      b.addEventListener('pointerdown',e=>{ e.preventDefault(); down(r,c); b.setPointerCapture&&b.setPointerCapture(e.pointerId); });
      b.addEventListener('pointerenter',()=>{ if(dragging) dragOver(r,c); });
      b.addEventListener('click',e=>{ if(e.detail===0) tapCell(r,c); }); // keyboard Enter/Space only
      row.appendChild(b); cellEls[key(r,c)]=b;
    }
    board.appendChild(row);
  }
  let moved=false;
  document.addEventListener('pointerup',()=>{ if(dragging){ dragging=false; if(moved && path.length>1) submit(); } });

  const adj = (a,b)=> Math.max(Math.abs(a.r-b.r),Math.abs(a.c-b.c))===1;
  const inPath = (r,c)=> path.some(p=>p.r===r&&p.c===c);

  // Mutate the current path for one tap/extend. Returns true if this action
  // should submit (re-tapping the last cell), false to keep building, null to ignore.
  function step(r,c){
    if(cellState[key(r,c)]) return null;
    if(!path.length){ path=[{r,c}]; return false; }
    const i=path.findIndex(p=>p.r===r&&p.c===c);
    if(i===path.length-1) return true;                 // re-tap the last cell = submit
    if(i>=0){ path=path.slice(0,i+1); return false; }  // tap an earlier cell = trim back
    if(adj(path[path.length-1],{r,c})){ path.push({r,c}); return false; } // extend to neighbour
    path=[{r,c}]; return false;                         // tap far away = start over
  }
  // Pointer down: begins a drag and also handles mouse/touch tap-to-build.
  function down(r,c){ const s=step(r,c); if(s===null) return; if(s){ dragging=false; submit(); return; } dragging=true; moved=false; render(); }
  // Pointer drag across a neighbouring cell.
  function dragOver(r,c){
    if(cellState[key(r,c)]) return;
    const last=path[path.length-1];
    if(inPath(r,c)){ const i=path.findIndex(p=>p.r===r&&p.c===c); path=path.slice(0,i+1); moved=true; render(); return; }
    if(last && adj(last,{r,c})){ path.push({r,c}); moved=true; render(); }
  }
  // Keyboard activation (Enter/Space on a focused cell).
  function tapCell(r,c){ const s=step(r,c); if(s===null) return; if(s){ submit(); return; } render(); }

  function render(){
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const el=cellEls[key(r,c)]; el.classList.remove('path');
      const st=cellState[key(r,c)];
      el.classList.toggle('found', st==='found');
      el.classList.toggle('span', st==='span');
    }
    path.forEach(p=>cellEls[key(p.r,p.c)].classList.add('path'));
  }
  function say(m){ $('status').textContent=m; }

  function submit(){
    if(path.length<2){ path=[]; render(); return; }
    const s = path.map(p=>p.r+','+p.c).join(' ');
    const w = sig[s];
    if(w && !found[w.word]){
      found[w.word]=true;
      w.path.forEach(p=>cellState[key(p[0],p[1])] = w.spangram?'span':'found');
      say('“'+w.word.toLowerCase()+'”'+(w.spangram?' — the spangram! 🎉':' ✓'));
      path=[]; render(); renderProgress(); checkWin();
    } else if(w && found[w.word]){
      say('Already found “'+w.word.toLowerCase()+'”.'); path=[]; render();
    } else {
      say('Not one of the hidden words.'); path=[]; render();
    }
  }

  function renderProgress(){
    const total=PUZZLE.words.length, got=Object.keys(found).length;
    $('progress').textContent = got+' of '+total+' found';
    const chips=$('chips'); chips.innerHTML='';
    PUZZLE.words.forEach(w=>{
      if(found[w.word]){ const c=document.createElement('span'); c.className='chip'+(w.spangram?' span':''); c.textContent=w.word.toLowerCase(); chips.appendChild(c); }
    });
  }

  function checkWin(){
    if(Object.keys(found).length!==PUZZLE.words.length) return;
    const line='Strands — solved “'+PUZZLE.theme+'” (spangram: '+PUZZLE.spangram+')';
    $('end').innerHTML=
      '<div class="end"><p class="cat">Solved! 🎉</p>'+
      '<p>You found all '+PUZZLE.words.length+' words, including the spangram <b>'+PUZZLE.spangram.toLowerCase()+'</b>.</p>'+
      '<div class="share"><label class="visually-hidden" for="res">Your result</label>'+
      '<input id="res" readonly value="'+line.replace(/"/g,'&quot;')+'">'+
      '<button class="primary" id="copy" type="button">Copy result</button></div>'+
      '<p class="lede" style="margin-top:.8rem">Tell us you cracked it if you\'re thinking about joining the lab.</p></div>';
    const input=$('res');
    $('copy').addEventListener('click',()=>{ input.select(); input.setSelectionRange(0,999);
      let ok=false; try{ok=document.execCommand('copy');}catch(e){}
      if(navigator.clipboard){navigator.clipboard.writeText(input.value).catch(()=>{});ok=true;}
      const b=$('copy'); const t=b.textContent; b.textContent=ok?'Copied ✓':'Select & copy'; setTimeout(()=>b.textContent=t,1400); });
  }

  $('clear').addEventListener('click',()=>{ path=[]; render(); say('Cleared.'); });
  $('submit').addEventListener('click',()=> submit());

  renderProgress();
})();
</script>
</body>
</html>
